name: TestFlight build status

# Asks App Store Connect whether an uploaded build finished processing (VALID) or was
# rejected (INVALID, e.g. ITMS-90208). Uses the same API key secrets as TestFlight.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion)"
        required: true
      platform:
        type: choice
        options: [TV_OS, IOS]
        default: TV_OS

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Write API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Wait for processing
        run: python3 scripts/asc_build_status.py
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
